name: Codex Android transport checks

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/agy/codex/**"
      - "app/README.md"
      - ".github/workflows/codex-bridge-check.yml"
  push:
    branches: [codex-android-experiment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-transport:
    name: Compile experimental Codex transport
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Android API 28 stubs
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          curl --fail --silent --show-error --location \
            https://github.com/Sable/android-platforms/raw/master/android-28/android.jar \
            --output "$RUNNER_TEMP/android/android.jar"
          test -s "$RUNNER_TEMP/android/android.jar"

      - name: Compile Codex transport against Android API
        run: |
          mkdir -p "$RUNNER_TEMP/codex-classes"
          javac -source 8 -target 8 \
            -classpath "$RUNNER_TEMP/android/android.jar" \
            -d "$RUNNER_TEMP/codex-classes" \
            app/src/main/java/com/agy/codex/CodexAppServer.java
          test -f "$RUNNER_TEMP/codex-classes/com/agy/codex/CodexAppServer.class"

      - name: Validate Java source whitespace
        run: git diff --check
